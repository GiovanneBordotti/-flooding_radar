version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: flooding_radar_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flooding_radar
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgweb:
    image: sosedoff/pgweb
    container_name: flooding_radar_pgweb
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flooding_radar
    depends_on:
      - db
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: flooding_radar_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Interface visual do RabbitMQ

volumes:
  postgis_data:
